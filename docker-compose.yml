services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hl7fhirbridge
      POSTGRES_USER: hl7fhirbridge
      POSTGRES_PASSWORD: hl7fhirbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hl7fhirbridge -d hl7fhirbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hl7fhirbridge
      DB_USER: hl7fhirbridge
      DB_PASSWORD: hl7fhirbridge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
